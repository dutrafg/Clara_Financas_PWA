name: Clara RC3.5 - QA PWA Offline
on:
  push:
    branches: [main, 'release/**', 'feature/clara-dashboard-miniapps']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
      - run: npm run build
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install playwright==1.55.0
      - run: python -m playwright install --with-deps chromium
      - name: Iniciar servidor e executar Playwright (PWA/offline)
        run: |
          python -m http.server 8765 --directory dist --bind 127.0.0.1 &
          sleep 3
          python tests/pwa_browser.py
