name: Clara PWA - QA, referências e cache offline
on:
  push:
    branches: [main, 'release/**', 'feature/clara-dashboard-miniapps']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Suíte estática e integridade financeira
        run: npm test
      - run: npm run build
      - name: Auditoria de versões, links locais e cache offline
        run: npm run verify:paths
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install playwright==1.55.0
      - run: python -m playwright install --with-deps chromium
      - name: Iniciar servidor e executar Playwright (PWA/offline)
        run: |
          python -m http.server 8765 --directory dist --bind 127.0.0.1 &
          sleep 3
          python tests/security_pwa.py
          python tests/pwa_browser.py
          python tests/miniapps_extended.py
          python -m http.server 8766 --directory . --bind 127.0.0.1 &
          sleep 2
          python tests/version_paths_browser.py
