name: Clara Finanças — QA contínuo

on:
  push:
    branches:
      - main
      - 'homologacao/**'
      - feature/clara-design-premium-cleanup
      - feature/clara-411-modo-demonstracao
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-rc3610:
    name: Node + PWA Chromium 390/768/1440
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Executar testes de regressão
        run: npm test
      - name: Gerar pacote PWA
        run: npm run build
      - name: Validar caminhos, versão e cache
        run: npm run verify:paths
      - name: Instalar Playwright
        run: |
          python -m pip install --upgrade pip
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Testar no Chromium com servidor de distribuição
        shell: bash
        run: |
          set -euo pipefail
          python -m http.server 8765 --directory dist > /tmp/clara-http-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          python tests/pwa_browser.py 2>&1 | tee /tmp/clara-pwa-browser.log
      - name: Verificar cofre, migração e conteúdo cifrado
        shell: bash
        run: |
          set -euo pipefail
          python -m http.server 8765 --directory dist > /tmp/clara-security-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          python tests/security_pwa.py 2>&1 | tee /tmp/clara-security-browser.log
      - name: Rejeitar valores inválidos e testar saída contra HTML ativo
        shell: bash
        run: |
          set -euo pipefail
          python -m http.server 8765 --directory dist > /tmp/clara-input-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          python tests/input_validation_browser.py 2>&1 | tee /tmp/clara-input-browser.log
      - name: Validar troca real do Service Worker em subpasta e offline
        shell: bash
        run: |
          set -euo pipefail
          python -m http.server 8766 --directory . > /tmp/clara-version-paths-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          python tests/version_paths_browser.py 2>&1 | tee /tmp/clara-version-paths-browser.log
      - name: Simular atualização travada e validar glass em três resoluções
        shell: bash
        run: |
          set -euo pipefail
          python -m http.server 8765 --directory dist > /tmp/clara-updater-recovery-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          python tests/update_recovery_browser.py 2>&1 | tee /tmp/clara-updater-recovery-browser.log
      - name: Simular falha de módulo crítico e confirmar rollback no Chromium
        shell: bash
        run: |
          set -euo pipefail
          python -m http.server 8765 --directory dist > /tmp/clara-updater-rollback-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          python tests/updater_rollback_browser.py 2>&1 | tee /tmp/clara-updater-rollback-browser.log
      - name: Testar calendário e central de notificações no Chromium
        shell: bash
        run: |
          set -euo pipefail
          python -m http.server 8765 --directory dist > /tmp/clara-agenda-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          python tests/agenda_browser.py 2>&1 | tee /tmp/clara-agenda-browser.log
      - name: QA visual Clara Studio em seis resoluções
        shell: bash
        run: |
          set -euo pipefail
          python -m http.server 8765 --directory dist > /tmp/clara-studio-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          python tests/studio_browser.py 2>&1 | tee /tmp/clara-studio-browser.log
      - name: Validar demonstração e dock desktop em cinco resoluções
        shell: bash
        run: |
          set -euo pipefail
          python -m http.server 8765 --directory dist >/tmp/clara-guest-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          python tests/guest_desktop_browser.py 2>&1 | tee /tmp/clara-guest-browser.log
      - name: Testar lembretes, bloco de notas e backup privado no Chromium
        shell: bash
        run: |
          set -euo pipefail
          python -m http.server 8765 --directory dist > /tmp/clara-extras-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          python tests/extras_backup_browser.py 2>&1 | tee /tmp/clara-extras-browser.log
      - name: Regressão ampliada dos 15 miniaplicativos
        shell: bash
        run: |
          set -euo pipefail
          python -m http.server 8765 --directory dist > /tmp/clara-http-extended.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          python tests/miniapps_extended.py 2>&1 | tee /tmp/clara-miniapps-extended.log
      - name: Guardar logs de QA
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: clara-4-qa-logs
          path: |
            /tmp/clara-http-server.log
            /tmp/clara-pwa-browser.log
            /tmp/clara-security-browser.log
            /tmp/clara-input-browser.log
            /tmp/clara-miniapps-extended.log
            /tmp/clara-version-paths-browser.log
            /tmp/clara-updater-recovery-browser.log
            /tmp/clara-updater-rollback-browser.log
            /tmp/clara-version-paths-server.log
            /tmp/clara-agenda-browser.log
            /tmp/clara-guest-browser.log
            /tmp/clara-extras-browser.log
            /tmp/clara-studio-browser.log
            /tmp/clara-studio-shots/
          if-no-files-found: ignore
