name: Homologar Clara Finanças Etapa 04
on:
  push:
    branches: [homologacao/etapa-04]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Configurar Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Dependências
        run: npm install --no-audit --no-fund
      - name: Testes financeiros (etapas 1 a 4)
        run: npm test
      - name: TypeScript e compilação de produção
        run: npm run build
      - name: Configurar Python e Chromium
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar Playwright
        run: |
          python -m pip install playwright==1.55.0
          python -m playwright install --with-deps chromium
      - name: Homologar banco real, offline, UI e parcelamentos
        run: python tests/e2e_production.py
      - name: Evidências de interface
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: clara-etapa04-testes
          path: |
            tests/e2e-desktop.png
            tests/e2e-mobile.png
          if-no-files-found: warn
          retention-days: 7
