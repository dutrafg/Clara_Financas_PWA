name: Homologar Clara Finanças RC2 Integrada PWA Vercel
on:
  push:
    branches: [homologacao/rc-final-integrada]
    paths:
      - 'src/**'
      - 'public/**'
      - 'tests/**'
      - 'package.json'
      - 'tsconfig.json'
      - 'vite.config.ts'
      - 'vercel.json'
      - 'tools/**'
      - '.github/workflows/importar-rc2.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  homologar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar dependências
        run: npm install --no-audit --no-fund
      - name: Testar regras financeiras e regressão 1–10
        run: npm test
      - name: Verificar TypeScript e compilar Vite
        run: npm run build
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar navegador Chromium
        run: |
          python -m pip install playwright==1.55.0
          python -m playwright install --with-deps chromium
      - name: Validar PWA Vercel, cofre IndexedDB, migração, PDF e offline
        run: python tests/e2e_production.py
      - name: Publicar evidências
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: clara-rc2-integrada-evidencias
          path: |
            tests/e2e-desktop.png
            tests/e2e-mobile.png
          if-no-files-found: warn
          retention-days: 7
