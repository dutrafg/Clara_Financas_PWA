name: Clara Finanças - Homologação Etapa 02
on:
  workflow_dispatch:
  push:
    branches:
      - 'homologacao/**'
  pull_request:
    branches:
      - main
permissions:
  contents: read
concurrency:
  group: clara-etapa02-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build-test-browser:
    name: Motor financeiro, TypeScript, build e PWA
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Conferir arquivos da aplicação
        run: |
          test -f package.json
          test -f src/App.tsx
          test -f tests/e2e_production.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar dependências
        run: |
          if [ -f package-lock.json ]; then npm ci --no-audit --no-fund
          else npm install --no-audit --no-fund
          fi
      - name: Testar o motor financeiro
        run: npm test
      - name: Validar TypeScript e compilar Vite
        run: npm run build
      - name: Instalar Playwright
        run: |
          python -m pip install playwright==1.55.0
          python -m playwright install --with-deps chromium
      - name: Executar E2E com IndexedDB e Service Worker
        run: python tests/e2e_production.py
      - name: Salvar evidências
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: clara-etapa02-evidencias
          path: |
            dist/
            tests/e2e-desktop.png
            tests/e2e-mobile.png
          if-no-files-found: warn
          retention-days: 7
