name: Clara — GitHub Pages (homologação)

on:
  push:
    branches:
      - homologacao/pages
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages-homologacao
  cancel-in-progress: false

jobs:
  validar:
    name: Verificar Clara antes da homologação
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout da branch de homologação
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Regressão estática
        run: npm test
      - name: Construir PWA
        run: npm run build
      - name: Verificar Service Worker e caminhos
        run: npm run verify:paths
      - name: Preparar Playwright
        run: |
          python -m pip install playwright==1.55.0
          python -m playwright install --with-deps chromium
      - name: Validar interface, cofre e offline
        shell: bash
        run: |
          set -euo pipefail
          python -m http.server 8765 --directory dist > /tmp/clara-pages-test.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          python tests/pwa_browser.py
      - name: Guardar build validado
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist
  publicar:
    name: Enviar somente homologação ao GitHub Pages
    needs: validar
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar build validado
        id: deployment
        uses: actions/deploy-pages@v4
