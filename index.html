  claraUnlocked=false;claraKey=null;auditBaseline=null;state=fresh();
  active='painel';render();
  secureShow(claraError?.message);
  claraLocking=false;
}
async function secureExport() {
  if(!claraUnlocked||!claraKey)throw Error('Desbloqueie o cofre para exportar.');
  await claraSaving;
  const raw=readVault();
  validateVault(raw);
  dl('clara-financas-backup-'+todayISO()+'.clara',raw,'application/octet-stream');
}
secureDom('securityForm').addEventListener('submit',async e=>{
  e.preventDefault();
  const button=secureDom('securitySubmit');button.disabled=true;
  const p=secureDom('securityPassword').value,q=secureDom('securityConfirm').value;
  try{await secureEnter(p,q);}catch(err){secureStatus(err.message);}
  finally{secureDom('securityPassword').value='';secureDom('securityConfirm').value='';button.disabled=false;}
});
document.addEventListener('visibilitychange',()=>{if(document.hidden)secureLock();});
window.addEventListener('pagehide',()=>{if(claraUnlocked)secureLock();});
window.addEventListener('storage',e=>{if(e.key===CLARA_VAULT_KEY&&claraUnlocked&&e.newValue!==claraVaultRaw){storageConflict=true;secureLock();}});
document.addEventListener('change',async e=>{
  if(e.target.id!=='importClara')return;
  const file=e.target.files?.[0];e.target.value='';if(!file)return;
  try{
    if(file.size>15_000_000)throw Error('Backup excede 15 MB.');
    const raw=await file.text(),v=validateVault(raw);
    const pass=window.prompt('Informe a senha do backup .clara:');if(pass===null)return;
    const key=await deriveKey(pass,b64Bytes(v.salt));
    const imported=await decryptState(v,key);
    openConfirmModal('Restaurar cofre protegido','O backup foi autenticado e validado. Substituir os dados atuais?',()=>{
      const previous=state;state=imported;
      try{persistSuccess('Backup criptografado restaurado no cofre atual.');}catch(err){state=previous;showToast(err.message,true);}
    });
  }catch(err){showToast(err.message,true);}
});
async function secureRestoreLocalEncrypted(raw,password){
  if(!claraUnlocked||!claraKey||claraError||window.ClaraGuest?.active)throw Error('Desbloqueie o cofre para restaurar um backup.');
  await claraSaving;
  const v=validateVault(raw);
  const key=await deriveKey(password,b64Bytes(v.salt));
  let imported;
  try{imported=await decryptState(v,key);}
  catch{throw Error('Senha do backup incorreta ou arquivo adulterado. Nada foi alterado.');}
  if(!Array.isArray(imported.reminders))imported.reminders=[];
  if(!Array.isArray(imported.quickNotes))imported.quickNotes=[];
  if(!Array.isArray(imported.calendarEvents))imported.calendarEvents=[];
  if(!Array.isArray(imported.notificationsRead))imported.notificationsRead=[];
  validateData(imported);
  const old=state;
  state=withDefaultPreferences(imported);
  try{persistSuccess('Backup local restaurado com segurança.');await claraSaving;}
  catch(error){state=old;render();throw error;}
}
window.ClaraSecurity={lock:secureLock,exportBackup:secureExport,restoreLocalEncrypted:secureRestoreLocalEncrypted,flush:async()=>{await claraSaving;await window.ClaraBackups?.flush?.();},get unlocked(){return claraUnlocked;},get vaultKey(){return CLARA_VAULT_KEY;}};
window.ClaraPrivateFolder={get folder(){return CLARA_FS_FOLDER;},get active(){return claraFSAvailable;},get revision(){return claraFSRevision;},get warning(){return claraFSWarning;}};
(async()=>{
  try {
    if(!crypto?.subtle||!storageAvailable)throw Error('Navegador sem armazenamento criptografável. Use Chrome ou Edge em HTTPS.');
    await claraFSInit();
    secureMode(!readVault());
    if(initializationError)secureStatus(initializationError);
  } catch(err) {
    secureDom('securityTitle').textContent='Proteção indisponível';
    secureDom('securityMessage').textContent='Não é seguro abrir registros neste ambiente.';
    secureStatus(err.message);secureDom('securitySubmit').disabled=true;
  }
})();

</script>

<script id="clara-install-runtime">
'use strict';
// Chrome oferece beforeinstallprompt; outros navegadores exigem a instalação manual.
const ClaraInstall=(()=>{
 let candidate=null,installed=window.matchMedia('(display-mode: standalone)').matches||
   window.navigator.standalone===true;
 const get=id=>document.getElementById(id);
 const ua=navigator.userAgent||'';
 const samsung=/SamsungBrowser\//i.test(ua);
 const chrome=/Chrome\//i.test(ua)&&!/EdgA\//i.test(ua)&&!samsung;
 function guidance(){
  if(samsung)return 'No Samsung Internet, abra o menu ≡ e escolha Adicionar página a → Tela inicial. Confirme a instalação quando oferecida.';
  if(chrome)return 'No Chrome, primeiro abra o site normalmente. Depois toque em ⋮ → Instalar aplicativo ou Adicionar à tela inicial. Se o site mostrar ERR_FAILED, a instalação não funcionará até a conexão ser corrigida.';
  return 'No menu do navegador, escolha Instalar aplicativo ou Adicionar à tela inicial. A opção depende do navegador e da versão do Android.';
 }
 function paint(){
  const status=get('claraInstallStatus'),button=get('claraInstallBtn'),help=get('claraInstallInstructions');
  if(help)help.textContent=guidance();
  if(!status||!button)return;
  if(installed||window.matchMedia('(display-mode: standalone)').matches){
   status.textContent='Clara já está instalado neste navegador.';
   status.dataset.status='installed';
   button.hidden=true;
  }else if(candidate){
   status.textContent='Instalação disponível neste navegador.';
   status.dataset.status='ready';button.hidden=false;button.textContent='Instalar Clara';
  }else{
   status.textContent=samsung?'Instale pelo menu do Samsung Internet.':'Instalação pelo menu do navegador.';
   status.dataset.status='manual';button.hidden=false;button.textContent='Como instalar';
  }
 }
 async function request(){
  if(installed)return;
  if(!candidate){
   const help=get('claraInstallHelp');
   if(help){help.open=true;help.scrollIntoView({behavior:'smooth',block:'nearest'});}
   paint();return;
  }
  const prompt=candidate;candidate=null;paint();
  try{
   await prompt.prompt();
   const choice=await prompt.userChoice;
   if(choice?.outcome==='accepted'){
    const status=get('claraInstallStatus');if(status)status.textContent='Instalação solicitada. Aguarde a confirmação do navegador.';
   }else{paint();}
  }catch(err){
   const status=get('claraInstallStatus');
   if(status)status.textContent='Não foi possível iniciar a instalação. Utilize o menu do navegador.';
   get('claraInstallHelp')?.setAttribute('open','');
  }
 }
 window.addEventListener('beforeinstallprompt',event=>{
  event.preventDefault();candidate=event;paint();
 });
 window.addEventListener('appinstalled',()=>{candidate=null;installed=true;paint();});
 document.addEventListener('click',event=>{
  if(event.target?.closest?.('#claraInstallBtn'))request();
 });
 return {paint,request,get available(){return !!candidate;},get installed(){return installed;}};
})();
window.ClaraInstall=ClaraInstall;
</script>

<script id="clara-reload-guard">
'use strict';
/* Este bloqueio evita recarregamentos involuntários; um site não controla
   o botão de recarregar do navegador nem o encerramento forçado do aplicativo. */
(() => {
  let approvedOfficialUpdateUntil=0;
  const enabled=()=>Boolean(window.ClaraSecurity?.unlocked && pref('reloadLock') && Date.now()>=approvedOfficialUpdateUntil);
  const isReloadShortcut=e=>{
    const key=String(e.key||'').toLowerCase();
    return key==='f5'||(key==='r'&&(e.ctrlKey||e.metaKey)&&!e.altKey);
  };
  document.addEventListener('keydown',event=>{
    if(!isReloadShortcut(event)||!enabled())return;
    event.preventDefault();
    event.stopImmediatePropagation();
    showToast('Recarregamento bloqueado. Para permitir, abra Mais → Segurança e backup → Atualizações.');
  },true);
  window.addEventListener('beforeunload',event=>{
    if(!enabled())return;
    event.preventDefault();
    event.returnValue=' ';
  });
  window.ClaraReloadGuard={
    get enabled(){return enabled();},
    allowOfficialUpdate(){approvedOfficialUpdateUntil=Date.now()+15000;}
  };
})();
</script>
